<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100f13"><title>Jerm747 Arcade</title><link rel="stylesheet" href="cabinet.css"><link rel="stylesheet" href="cabinet-fit.css"><link rel="stylesheet" href="view-switch.css"><link rel="stylesheet" href="pocket/host.css?v=111"><script defer src="pocket/pocket.js?v=111"></script><script defer src="arcade-back.js"></script><script defer src="hud/mount.js"></script><script defer src="hud/sessions.js"></script><script defer src="cabinet.js"></script><script defer src="arcade-visor.js"></script></head>
<body><main id="cabinet">
<header class="marquee"><i></i><h1>JERM<span>747</span> <b>ARCADE</b></h1><i></i><button type="button" id="cabinet-hud" aria-label="Arcade settings" title="Arcade settings"><img src="hud/icons/hud-overlay.svg" alt=""></button></header>
<div class="housing"><aside class="wing left" aria-hidden="true"><div class="rail"><i></i><b>747</b><i></i></div></aside><div class="monitor">
<div class="chooser"><h3>Game cabinet</h3><label class="view-switch" data-view="list"><span class="view-switch-track" aria-hidden="true"><span>List</span><span>Grid</span></span><input id="view-slider" type="range" min="0" max="1" step="1" value="0" aria-label="Game view" aria-valuetext="List"></label></div><div id="case-list" aria-label="Games"></div><section id="spotlight" aria-live="polite"><button id="open-cover" class="poster" aria-label="Enlarge cover"><img id="hero" alt=""><span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4m4 0h4v4m0 4v4h-4m-4 0H2v-4"/></svg></span></button><div class="label"><small id="genre"></small><h2 id="title"></h2><p id="description"></p><button id="play"><span aria-hidden="true">▶</span> Play game</button></div></section>
<nav class="rack" aria-label="Game shelf"><div class="rackbar"><h3>Game select</h3><div><button id="prev" aria-label="Previous game">‹</button><span id="count"></span><button id="next" aria-label="Next game">›</button></div></div><div id="shelf"></div></nav>
</div><aside class="wing right" aria-hidden="true"><div class="rail"><i></i><b>747</b><i></i></div></aside></div><footer><i></i><span>JERM747</span><i></i></footer></main>
<dialog id="cover-view"><button class="back-key" id="close-cover">‹ Back</button><img id="full-cover" alt=""></dialog>
<section id="session" hidden aria-label="Full-screen game"><nav class="game-nav" aria-label="Game navigation"><button class="back-key" id="game-back">‹ Back</button><button id="game-hud" aria-label="Open game HUD">HUD</button><button id="cab-start" title="Start — return to cabinet">Cabinet <small>START</small></button></nav><div id="game-entry" hidden><img id="entry-art" alt=""></div></section>
</body></html>
