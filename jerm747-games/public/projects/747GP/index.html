<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>747 GP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050608;color:#e9ecf2;font-family:'Barlow',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .7s ease}
.scr.on{opacity:1;pointer-events:auto}
.ph{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));font:600 10px 'Barlow Condensed';letter-spacing:.2em;color:#4d5360;text-transform:uppercase}
/* 1 · dev logo (placeholder) */
#logo .mark{width:min(320px,70vw);aspect-ratio:16/9;border:1.5px dashed #2c313b;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform:scale(.96);transition:transform 2.6s ease}
#logo.on .mark{transform:scale(1)}
#logo .mark b{font:900 clamp(26px,6vw,40px) 'Orbitron';letter-spacing:.06em;color:#fff}
#logo .mark small{font:600 12px 'Barlow Condensed';letter-spacing:.3em;color:#ff9f1c}
/* 2 · title (placeholder) */
#title{background:#000}
#title .bg{position:absolute;inset:-4%;background:url(cover.webp) center top/cover no-repeat;filter:brightness(.62) saturate(1.05);transform:scale(1.04);animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-1.5%,-1%)}}
#title .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 35%,rgba(0,0,0,0) 60%,rgba(0,0,0,.75))}
#title h1{position:relative;font:900 clamp(54px,13vw,128px) 'Orbitron';letter-spacing:.04em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6);line-height:1}
#title .sub{position:relative;font:600 clamp(12px,2.2vw,16px) 'Barlow Condensed';letter-spacing:.42em;color:#ff9f1c;margin-top:10px}
#title .press{position:absolute;bottom:calc(16% + env(safe-area-inset-bottom));font:600 clamp(14px,2.6vw,20px) 'Barlow Condensed';letter-spacing:.4em;color:#fff;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
/* 3 · mode select + 3b · transmission */
.pick h2{font:600 13px 'Barlow Condensed';letter-spacing:.32em;color:#9aa3b5;margin-bottom:4px}
.pick h3{font:700 clamp(28px,6vw,46px) 'Barlow Condensed';letter-spacing:.04em;text-transform:uppercase;margin-bottom:22px}
.cards{display:flex;gap:16px;padding:0 16px;width:100%;max-width:760px;justify-content:center}
.card{flex:1;max-width:340px;min-height:190px;border-radius:18px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);padding:18px 18px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;text-align:left;color:#e9ecf2;transition:transform .2s,border-color .25s,background .25s}
.card .k{font:600 11px 'Barlow Condensed';letter-spacing:.24em;color:#7d8597}
.card b{font:700 clamp(24px,4.6vw,34px) 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;line-height:1}
.card p{font-size:14px;color:#b6bdca;line-height:1.35}
.card i{margin-top:auto;font:600 11px 'Barlow Condensed';letter-spacing:.2em;color:#5c626b;font-style:normal}
.card.sel{border-color:var(--c);background:rgba(255,255,255,.07);transform:translateY(-3px)}
.card.sel i{color:var(--c)}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;font:600 13px 'Barlow Condensed';letter-spacing:.2em;color:#9aa3b5;background:none;border:0;cursor:pointer;padding:8px}
.steps{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;font:600 10px 'Barlow Condensed';letter-spacing:.18em;color:#4d5360}
.steps span.on{color:#e9ecf2}.steps em{width:14px;height:1px;background:#2c313b}
.hint{margin-top:18px;font:500 12px 'Barlow Condensed';letter-spacing:.2em;color:#5c626b}
@media (max-width:560px){.cards{flex-direction:column;align-items:center}.card{width:100%;min-height:0}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
</style>
</head>
<body>
<!-- 1 · DEV SCREEN LOGO (placeholder until the real screen lands) -->
<section class="scr" id="logo">
  <div class="mark"><b>JERM747</b><small>GAMES</small></div>
  <div class="ph">Placeholder · dev screen logo</div>
</section>
<!-- 2 · GAME TITLE SCREEN (placeholder) -->
<section class="scr" id="title">
  <div class="bg"></div><div class="shade"></div>
  <div class="press" id="press">PRESS START</div>
  <div class="ph">Placeholder · game title screen</div>
</section>
<!-- 3 · MODE SELECT -->
<section class="scr pick" id="mode">
  <button class="back" data-back="title">‹ TITLE</button>
  <h2>STEP 1</h2><h3>Choose a mode</h3>
  <div class="cards">
    <button class="card" data-v="arcade" style="--c:#ff9f1c"><span class="k">MODE</span><b>Arcade</b><p>Line up on the grid with the field and race three laps to the flag.</p><i>SELECT ›</i></button>
    <button class="card" data-v="trial" style="--c:#6aa8ff"><span class="k">MODE</span><b>Time Trial</b><p>Just you and the clock. Run as many laps as you like and chase your best.</p><i>SELECT ›</i></button>
  </div>
  <div class="hint">◀ ▶ TO CHOOSE · A / ENTER / TAP TO SELECT</div>
  <div class="steps"><span class="on">MODE</span><em></em><span>GEARBOX</span><em></em><span>RIDE</span><em></em><span>TRACK</span><em></em><span>RACE</span></div>
</section>
<!-- 3b · AUTOMATIC / MANUAL -->
<section class="scr pick" id="trans">
  <button class="back" data-back="mode">‹ MODE</button>
  <h2>STEP 2</h2><h3>Choose a gearbox</h3>
  <div class="cards">
    <button class="card" data-v="auto" style="--c:#39e75f"><span class="k">GEARBOX</span><b>Automatic</b><p>The car shifts for you. Just steer, brake and stay on the gas.</p><i>SELECT ›</i></button>
    <button class="card" data-v="manual" style="--c:#ff5d8f"><span class="k">GEARBOX</span><b>Manual</b><p>You shift. E / Q on the keyboard, the bumpers on a controller, or the + / – buttons on screen.</p><i>SELECT ›</i></button>
  </div>
  <div class="hint">YOU CAN CHANGE THIS LATER IN THE MENU</div>
  <div class="steps"><span>MODE</span><em></em><span class="on">GEARBOX</span><em></em><span>RIDE</span><em></em><span>TRACK</span><em></em><span>RACE</span></div>
</section>
<div id="fade"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let cur=null,timer=0;
// gentle UI sounds (only after the player has interacted)
let ac=null;function tone(f,v,d,type){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const tick=()=>tone(1500,.03,.06),okSnd=()=>{tone(880,.08,.12,'square');setTimeout(()=>tone(1320,.06,.2,'square'),90)};
function show(id){clearTimeout(timer);document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));cur=id;
  if(id==='logo')timer=setTimeout(()=>show('title'),3000);
  if(id==='title')prefetch();
  if(id==='mode'||id==='trans')focusSaved(id);}
// warm the cache for the next steps while the player reads the menus
let pre=false;function prefetch(){if(pre)return;pre=true;
  const car=store('gp747car')||'f1',links=['showroom.html','tracks.html','race.html','cars/'+car+'.js','cars/thumbs/'+car+'.webp','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'];
  for(const h of links){const l=document.createElement('link');l.rel='prefetch';l.href=h;document.head.appendChild(l);}}
function cards(id){return [...$(id).querySelectorAll('.card')];}
function focusSaved(id){const key=id==='mode'?'gp747mode':'gp747trans',v=store(key)||(id==='mode'?'arcade':'auto');
  cards(id).forEach(c=>c.classList.toggle('sel',c.dataset.v===v));}
function move(d){const cs=cards(cur);let i=cs.findIndex(c=>c.classList.contains('sel'));i=(i+d+cs.length)%cs.length;cs.forEach((c,j)=>c.classList.toggle('sel',j===i));tick();}
function choose(card){
  if(cur==='mode'){store('gp747mode',card.dataset.v);okSnd();show('trans');}
  else if(cur==='trans'){store('gp747trans',card.dataset.v);okSnd();$('fade').classList.add('on');setTimeout(()=>location.href='showroom.html',650);}
}
function confirm(){
  if(cur==='logo'){show('title');return;}
  if(cur==='title'){okSnd();show('mode');return;}
  const s=cards(cur).find(c=>c.classList.contains('sel'));if(s)choose(s);
}
function back(){if(cur==='trans')show('mode');else if(cur==='mode')show('title');}
document.querySelectorAll('.card').forEach(c=>{c.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){cards(cur).forEach(x=>x.classList.toggle('sel',x===c));}});c.addEventListener('click',e=>{e.stopPropagation();cards(cur).forEach(x=>x.classList.toggle('sel',x===c));choose(c);});});
document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();tick();show(b.dataset.back);}));
addEventListener('click',()=>{if(cur==='logo'||cur==='title')confirm();});
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowUp','KeyA','KeyW'].includes(e.code)&&(cur==='mode'||cur==='trans'))move(-1);
  else if(['ArrowRight','ArrowDown','KeyD','KeyS'].includes(e.code)&&(cur==='mode'||cur==='trans'))move(1);
  else if(['Enter','Space','NumpadEnter'].includes(e.code))confirm();
  else if(['Escape','Backspace'].includes(e.code))back();
  else if(cur==='logo'||cur==='title')confirm();
});
// controller: A = select, B = back, D-pad / left stick = choose, Start = select
let prev=[],axisHeld=0;
(function poll(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of pads){if(!g)continue;
    const p=i=>g.buttons[i]&&g.buttons[i].pressed&&!prev[i];
    if(p(0)||p(9))confirm();if(p(1))back();
    if(cur==='mode'||cur==='trans'){if(p(14)||p(12))move(-1);if(p(15)||p(13))move(1);
      const x=g.axes[0]||0;if(Math.abs(x)>0.6){if(!axisHeld){move(x>0?1:-1);axisHeld=1;}}else axisHeld=0;}
    prev=g.buttons.map(b=>b.pressed);break;}
  requestAnimationFrame(poll);
})();
// index.html#mode jumps straight to mode select (used by the in-race "Main menu")
show(location.hash==='#mode'?'mode':'logo');
})();
</script>
</body>
</html>
