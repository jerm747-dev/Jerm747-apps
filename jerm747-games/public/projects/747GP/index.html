<!doctype html>
<html lang="en" data-screen="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a09">
<title>747 GP · Jerm747 Games</title>
<link rel="icon" href="intro/gsx-core.png">
<link rel="stylesheet" href="intro/launch.css">
<link rel="stylesheet" href="ui/gp-ui.css">
<link rel="stylesheet" href="visuals/look.css">
<script src="visuals/look.js"></script>
<script defer src="intro/session.js"></script>
<script defer src="ui/gp-ui.js"></script>
<script defer src="intro/launch.js"></script>
<style>
/* 1.2.17: menu plates on the intro */
.title-block .gp-start{width:clamp(220px,25vw,360px);margin-top:clamp(18px,3.4vh,34px)}
.title-block .gp-start:disabled{visibility:hidden;opacity:0}
.grp-label{font-size:11px;color:#d3ccbf;text-transform:uppercase;letter-spacing:.2em;margin:clamp(10px,2.2vh,22px) 0 8px}
#modes{grid-template-columns:1fr !important}
.gear-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.gear-pair .gp-caption{font-size:9.5cqw;inset:0 3% 6% 22%}
.gear-pair .gp-marks{width:18%;left:3%}
.continue-plate{margin-top:clamp(10px,2vh,20px)}
#gearbox.nudge .gp-button{animation:gpNudge .65s ease-out}
@keyframes gpNudge{30%{transform:translateY(-3px);filter:drop-shadow(0 0 12px #ffd84a88) drop-shadow(0 3px 6px #0007)}}
#back.gp-chip{min-height:34px;padding:6px 16px;font-size:12px}
#ctlBtn.gp-chip{min-height:34px;padding:6px 16px;font-size:12px;margin-right:auto;margin-left:-10px}
.steps{display:flex;gap:6px;align-items:center;justify-content:center;font:600 10px BarlowCondensed,Arial,sans-serif;letter-spacing:.18em;color:#6d7264;margin-top:14px}
.steps span.on{color:#ffcf6e}.steps em{width:14px;height:1px;background:#3a3d34}
@media (orientation:landscape) and (max-height:520px){.grp-label{margin:6px 0 4px}.gp-stack{gap:5px}.steps{margin-top:6px}#setup h1{font-size:34px;margin-bottom:4px}}
</style>
</head>
<body>
<div class="scenery" aria-hidden="true" data-gp-menu-art>
  <picture><source media="(orientation:portrait)" srcset="intro/corner-portrait.webp"><img id="art" src="intro/corner.webp" alt="" fetchpriority="high"></picture>
  <div class="sunlight"></div>
</div>

<main>
  <section id="studio" class="screen" aria-label="Jerm747 Games developer introduction">
    <div class="studio-lockup">
      <img class="crest" src="intro/gsx-core.png" alt="">
      <h1>Jerm747 <span>Games</span></h1>
      <p>Powered by GSX Core</p>
    </div>
  </section>

  <section id="title" class="screen" aria-label="747 GP title screen" hidden>
    <div class="title-block">
      <h1><img class="title-mark" src="intro/747-gp-mark.png" alt="747 GP"></h1>
      <button id="start" class="gp-button gp-start pulse" aria-label="Press start" disabled></button>
    </div>
    <div class="car-caption"><span>Cinder Wyvern</span><small>1200cc <i></i> Hypercar</small></div>
  </section>

  <section id="setup" class="screen" aria-labelledby="setup-heading" hidden>
    <div class="setup-inner">
      <header class="setup-nav">
        <button id="back" class="gp-chip dark" aria-label="Back to title">‹ Title</button>
        <button id="ctlBtn" class="gp-chip dark" type="button">Controls</button>
        <img src="intro/747-gp-mark.png" alt="747 GP">
      </header>
      <h1 id="setup-heading">Mode select</h1>
      <div class="grp-label" id="mode-label">Race mode</div>
      <div id="modes" class="gp-stack" role="radiogroup" aria-labelledby="mode-label">
        <button class="gp-button gp-custom" role="radio" data-group="mode" data-value="arcade" aria-checked="true"><span class="gp-marks"></span><span class="gp-caption">Arcade<small>Race the field · 3 laps</small></span></button>
        <button class="gp-button gp-custom" role="radio" data-group="mode" data-value="time-trial" aria-checked="false"><span class="gp-marks"></span><span class="gp-caption">Time Trial<small>Chase your best lap</small></span></button>
      </div>
      <div class="grp-label" id="gear-label">Transmission</div>
      <div id="gearbox" class="gear-pair" role="radiogroup" aria-labelledby="gear-label">
        <button class="gp-button gp-custom" role="radio" data-group="transmission" data-value="automatic" aria-checked="true"><span class="gp-marks one"></span><span class="gp-caption">Automatic</span></button>
        <button class="gp-button gp-custom" role="radio" data-group="transmission" data-value="manual" aria-checked="false"><span class="gp-marks one"></span><span class="gp-caption">Manual</span></button>
      </div>
      <p id="shift-hint" aria-live="polite">The car handles each shift.</p>
      <button id="continue" class="gp-button gp-custom continue-plate"><span class="gp-marks"></span><span class="gp-caption">Enter showroom</span></button>
      <div class="steps" aria-hidden="true"><span class="on">MODE</span><em></em><span>RIDE</span><em></em><span>CONTROLS</span><em></em><span>RACE SETUP</span><em></em><span>RACE</span></div>
    </div>
  </section>
</main>
<noscript>Enable JavaScript to start 747 GP.</noscript>
</body>
</html>
