<!doctype html><html lang="en"><head><script src="/arcade-hud/game-clock.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Static · Animation Workshop</title><link rel="stylesheet" href="/projects/gs-fighter-2/android.css"><script src="gs-browser-bridge.js"></script><script src="/projects/gs-fighter-2/android.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#fbe4ba;font:14px system-ui}header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#131f32}h1{font:900 italic 20px system-ui;margin:0;flex:1}a{color:#a3f4ef}button,select{background:#22324c;color:#ffe4aa;border:1px solid #78979d;border-radius:7px;padding:7px 12px;font:700 13px system-ui}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 14px}input{accent-color:#f9c978}input[type=range]{width:120px}.views{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px}.view{border:1px solid #546e82;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#253449,#101a29)}h2{font:800 12px system-ui;text-align:center;margin:6px}canvas{display:block;width:100%;height:calc(100dvh - 158px);min-height:160px}p{padding:0 14px;color:#c4d0da;font-size:12px}.new{padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.new canvas{height:115px;min-height:0;background:#17253a}.new figcaption{font-size:10px;text-align:center}figure{margin:0}output{font-weight:800}button:focus-visible,a:focus-visible{outline:3px solid #90e4ed}</style></head><body><header><a href="/projects/gs-fighter-2/index.html">← Fighter select</a><h1>STATIC / MOTION WORKSHOP</h1></header><nav><select id="sequence" aria-label="Animation"><option value="auto" selected>Auto · all animations</option><option value="walk">Walk forward</option><option value="run">Run forward</option><option value="back">Walk backward</option><option value="jump">Rise & fall</option><option value="kHigh">Roundhouse high kick</option></select><button id="play">Pause</button><button id="step">Next frame</button><label>FPS <input id="fps" type="range" min="1" max="16" value="8"><output id="speed">8</output></label><label><input id="trails" type="checkbox" checked>Subtle trail</label><label><input id="guides" type="checkbox" checked>Root guides</label></nav><section class="views"><div class="view"><h2>BEFORE · EXISTING POSES</h2><canvas id="before"></canvas></div><div class="view"><h2>AFTER · NEW INTERMEDIATES</h2><canvas id="after"></canvas></div></section><p id="status">Loading Static’s poses…</p><section class="new" id="new"></section><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),data=await fetch('/projects/gs-fighter-2/static-workshop-data.json').then(r=>r.json()),images=new Map;await Promise.all([...new Set(Object.values(data.frames).map(f=>f.src))].map(src=>new Promise((ok,no)=>{const im=new Image;im.onload=()=>{images.set(src,im);ok()};im.onerror=no;im.src=src})));let frame=0,playing=true,last=0,acc=0,autoIndex=0,autoLoops=0;const autoOrder=['walk','run','back','jump','kHigh'];const currentSequence=()=>$('sequence').value==='auto'?autoOrder[autoIndex]:$('sequence').value;const labels=['Forward pass','Forward contact','Run pass','Run recovery','Back pass','Back contact','Rising','Falling','Kick upswing','Kick follow-through'];
function draw(canvas,key,ghost=null){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);const w=rect.width,h=rect.height,x=w*.5,y=h*.89;if($('guides').checked){c.strokeStyle='#8ed4cc66';c.beginPath();c.moveTo(x,12);c.lineTo(x,h);c.moveTo(8,y);c.lineTo(w-8,y);c.stroke();}const paint=(k,alpha)=>{const f=data.frames[k],scale=Math.min(h*.83/293,w*.72/290)*(f.poseScale||1);c.globalAlpha=alpha;c.drawImage(images.get(f.src),f.x,f.y,f.w,f.h,x-f.anchorX*scale,y-f.anchorY*scale,f.w*scale,f.h*scale);};if(ghost&&ghost!==key&&$('trails').checked)paint(ghost,.075);paint(key,1);}
function render(){const seq=data.sequences[currentSequence()],a=seq.before[Math.floor((frame%seq.after.length)/seq.after.length*seq.before.length)],b=seq.after[frame%seq.after.length];draw($('before'),a);draw($('after'),b,seq.after[(frame-1+seq.after.length)%seq.after.length]);$('status').textContent=currentSequence().toUpperCase()+' · After: frame '+(frame%seq.after.length+1)+' / '+seq.after.length+' · '+b+' · ten new drawings, 80 Static poses total. Both views keep a fixed body root and ground line.';}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};$('step').onclick=()=>{playing=false;$('play').textContent='Play';frame++;render()};$('sequence').onchange=()=>{frame=0;acc=0;autoIndex=0;autoLoops=0;render()};$('fps').oninput=()=>{$('speed').textContent=$('fps').value};$('trails').onchange=$('guides').onchange=render;window.addEventListener('resize',render);document.addEventListener('visibilitychange',()=>{last=0;acc=0});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowRight'){e.preventDefault();$('step').click()}});
for(const [n,key]of data.newFrames.entries()){const fig=document.createElement('figure'),can=document.createElement('canvas'),caption=document.createElement('figcaption');caption.textContent=labels[n];fig.append(can,caption);$('new').append(fig);draw(can,key);}function tick(t){if(last&&playing&&!document.hidden){acc+=Math.min(.1,(t-last)/1000);if(acc>=1/+$('fps').value){acc=0;frame++;if($('sequence').value==='auto'&&frame%data.sequences[currentSequence()].after.length===0){autoLoops++;if(autoLoops>=3){autoIndex=(autoIndex+1)%autoOrder.length;autoLoops=0;frame=0;}}render();}}last=t;requestAnimationFrame(tick)}render();requestAnimationFrame(tick);window.GSStaticPreview={data,render,get frame(){return frame},get currentSequence(){return currentSequence()}};
})().catch(()=>document.getElementById('status').textContent='Artwork could not load. Return to fighter select and retry.');
</script></body></html>
