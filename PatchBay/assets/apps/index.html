<!doctype html>
<html lang="en" data-finish="blue">
<head><link rel="stylesheet" href="./tap-clean.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e233d">
<title>Patch Bay 0.1.2</title>
<link rel="stylesheet" href="rack.css">
<script src="catalog.js" defer></script>
<script src="rack.js" defer></script>
</head>
<body>
<main class="cabinet">
  <header class="faceplate">
    <div class="brand"><button type="button" class="signal" aria-label="Cabinet light" aria-pressed="false" title="Toggle cabinet light"></button><div class="badges"><p class="nameplate"><span class="plate" role="img" aria-label="Jerm 747"></span></p><h1><img class="patchbay-badge" src="patchbay-blue.webp" width="440" height="126" draggable="false" alt="Patch Bay"></h1></div></div>
    <div class="finish">
      <button type="button" data-finish="blue" aria-pressed="true">Blue</button>
      <button type="button" data-finish="black" aria-pressed="false">Black</button>
    </div>
  </header>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search the rack" aria-label="Search the rack">
    <div class="views" aria-label="Layout">
      <button type="button" data-view="list" aria-pressed="true">Rack</button>
      <button type="button" data-view="grid" aria-pressed="false">Grid</button>
    </div>
  </div>
  <div class="chassis"><ul id="shelf" aria-label="Studio tools"></ul><p id="empty" hidden>No matching tools.</p></div>
  <div class="grille" aria-hidden="true"></div>
</main>
</body>
</html>
